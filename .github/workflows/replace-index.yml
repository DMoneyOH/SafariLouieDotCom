name: Replace index.html
on:
  workflow_dispatch:
jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded homepage into place
        run: |
          mv safari-louie.html index.html
          git config user.name "DMoneyOH"
          git config user.email "DMoneyOH@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with updated Safari Louie homepage"
          git push
